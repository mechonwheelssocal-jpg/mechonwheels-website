<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Mech on Wheels</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0a0a0f;
      color: #fefce8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 2rem; font-weight: 700; color: #fde047; margin-bottom: 12px; }
    p { color: #cbd5e1; font-size: 1rem; line-height: 1.6; margin-bottom: 32px; }
    a {
      display: inline-block;
      background: #9333ea;
      color: #fff;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    a:hover { background: #a855f7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔧</div>
    <h1>404 — Page Not Found</h1>
    <p>Looks like this page took a wrong turn. Let's get you back on the road.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
